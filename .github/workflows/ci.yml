name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: build-e-quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build, testes unitarios e BDD, gate de cobertura (JaCoCo)
        run: mvn -B -Dmaven.javadoc.skip=true -pl stella-core -am verify
      - name: Analise estatica (SpotBugs) - gate
        run: mvn -B -Dmaven.javadoc.skip=true -pl stella-core spotbugs:check
      - name: Mutation testing (PIT) - gate de mutation score
        run: mvn -B -Dmaven.javadoc.skip=true -pl stella-core org.pitest:pitest-maven:mutationCoverage
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-qualidade
          path: |
            stella-core/target/site/jacoco
            stella-core/target/pit-reports
            stella-core/target/cucumber-report.html
            stella-core/target/spotbugsXml.xml
